version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      production:
        patterns: ['*']
        exclude-patterns: ['@types/*', 'eslint*', 'prettier*', 'vitest*']
      dev:
        patterns: ['@types/*', 'eslint*', 'prettier*', 'vitest*']

  - package-ecosystem: cargo
    directory: /src-tauri
    open-pull-requests-limit: 0
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
